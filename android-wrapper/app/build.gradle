plugins {
    id 'com.android.application'
}

android {
    namespace 'cd.kintrafic.live'
    compileSdk 34

    defaultConfig {
        applicationId "cd.kintrafic.live"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0-demo"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
